spring.application.name=vetturno

# Conexion local. Las credenciales se reciben desde variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetturno}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seguridad. Usa una clave de al menos 32 caracteres y no la publiques en GitHub.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

springdoc.swagger-ui.path=/swagger-ui.html
